<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — {{ app_full_name }}</title>
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='img/favicon.ico') }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicon-32.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { 50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a' },
            accent:  { 50:'#ecfeff',100:'#cffafe',200:'#a5f3fc',300:'#67e8f9',400:'#22d3ee',500:'#06b6d4',600:'#0891b2',700:'#0e7490',800:'#155e75',900:'#164e63' },
            success: { 50:'#ecfdf5',100:'#d1fae5',200:'#a7f3d0',300:'#6ee7b7',400:'#34d399',500:'#10b981',600:'#059669',700:'#047857',800:'#065f46',900:'#064e3b' },
            warning: { 50:'#fffbeb',100:'#fef3c7',200:'#fde68a',300:'#fcd34d',400:'#fbbf24',500:'#f59e0b',600:'#d97706',700:'#b45309',800:'#92400e',900:'#78350f' },
            danger:  { 50:'#fef2f2',100:'#fee2e2',200:'#fecaca',300:'#fca5a5',400:'#f87171',500:'#ef4444',600:'#dc2626',700:'#b91c1c',800:'#991b1b',900:'#7f1d1d' },
          },
          fontFamily: {
            sans: ['Inter','system-ui','sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body{font-family:'Inter',system-ui,sans-serif}</style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-primary-900 via-primary-800 to-primary-700 px-4 py-8 relative overflow-hidden">

  <!-- Decorative background -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-24 -right-24 w-96 h-96 bg-white/5 rounded-full"></div>
    <div class="absolute -bottom-32 -left-16 w-80 h-80 bg-white/5 rounded-full"></div>
  </div>

  <div class="relative w-full max-w-md">
    <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">
      <!-- Header -->
      <div class="px-8 pt-8 pb-6 text-center">
        <img src="{{ url_for('static', filename='img/logo-gu-login.png') }}" alt="{{ app_full_name }}" class="mx-auto h-32 w-auto mb-2">
        <p class="text-slate-500 text-sm mt-1">Sistem Manajemen Inventaris Barang Non-Medis</p>
      </div>

      <!-- Form -->
      <form method="POST" class="px-8 pb-8 space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        {% if get_flashed_messages(with_categories=true) %}
          {% for category, message in get_flashed_messages(with_categories=true) %}
            <div class="flex items-center gap-2 rounded-lg border border-danger-200 bg-danger-50 text-danger-700 px-4 py-2.5 text-sm">
              <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
              <span>{{ message }}</span>
            </div>
          {% endfor %}
        {% endif %}

        <div>
          <label for="username" class="block text-sm font-medium text-slate-700 mb-1.5">Username</label>
          <input type="text" id="username" name="username" required autofocus
                 placeholder="Masukkan username"
                 class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition">
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
          <input type="password" id="password" name="password" required
                 placeholder="Masukkan password"
                 class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition">
        </div>

        <button type="submit"
                class="w-full rounded-lg bg-primary-600 hover:bg-primary-700 active:bg-primary-800 text-white font-semibold py-2.5 transition shadow-lg shadow-primary-900/30">
          Masuk
        </button>
      </form>
    </div>

    <p class="text-center text-primary-200 text-xs mt-6">Powered by IT RSH Kepanjen</p>
  </div>
</body>
</html>
